<!DOCTYPE html>
<html>
<head>
<title>Ikuthu Pay - STK System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00a651">
<style>
body{font-family:Arial,sans-serif;padding:15px;max-width:420px;margin:auto;background:#f0f2f5}
.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0001;margin-bottom:16px}
h2{text-align:center;color:#00a651}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-size:15px}
button{background:#00a651;color:white;font-weight:bold;border:none;cursor:pointer;font-size:16px}
button:disabled{background:#999}
.success{background:#e6f7ed;color:#0a7a32;padding:10px;border-radius:8px}
.fail{background:#fde8e8;color:#c00;padding:10px;border-radius:8px}
small{color:#666}
</style>
</head>
<body>
<h2>💰 Ikuthu Pay</h2>
<p style="text-align:center"><small>Sellable STK Push System for Shops</small></p>

<div class="card">
<h3>⚙️ Business Settings (Merchant)</h3>
<small>Till / Paybill where money goes</small>
<input id="till" placeholder="Shortcode e.g 174379">
<input id="key" placeholder="Consumer Key">
<input id="secret" placeholder="Consumer Secret">
<input id="passkey" placeholder="Passkey">
<button onclick="saveSettings()">Save Settings</button>
</div>

<div class="card">
<h3>📲 Send STK to Customer</h3>
<input id="phone" placeholder="Customer Phone 2547XXXXXXXX">
<input id="amount" type="number" placeholder="Amount e.g 1680">
<input id="ref" placeholder="Ref e.g ORDER-001">
<button id="sendBtn" onclick="sendSTK()">SEND STK PUSH</button>
<p id="status"></p>
<div id="history" style="margin-top:10px"></div>
</div>

<div class="card">
<small>💡 To sell: Each shop enters their OWN Daraja keys. Money goes direct to their Till. You charge Ksh 999/month for this system.</small>
</div>

<script>
function saveSettings(){
 localStorage.setItem('till',document.getElementById('till').value.trim());
 localStorage.setItem('key',document.getElementById('key').value.trim());
 localStorage.setItem('secret',document.getElementById('secret').value.trim());
 localStorage.setItem('passkey',document.getElementById('passkey').value.trim());
 alert('✅ Settings Saved!');
}
function loadSettings(){
 document.getElementById('till').value=localStorage.getItem('till')||'174379';
 document.getElementById('key').value=localStorage.getItem('key')||'';
 document.getElementById('secret').value=localStorage.getItem('secret')||'';
 document.getElementById('passkey').value=localStorage.getItem('passkey')||'';
}
loadSettings();

async function sendSTK(){
 const btn=document.getElementById('sendBtn');
 const status=document.getElementById('status');
 const phone=document.getElementById('phone').value.trim();
 const amount=document.getElementById('amount').value.trim();
 const ref=document.getElementById('ref').value.trim()||'Ikuthu';
 const till=localStorage.getItem('till');
 const key=localStorage.getItem('key');
 const secret=localStorage.getItem('secret');
 const passkey=localStorage.getItem('passkey');
 
 if(!phone||!amount||!till||!key){alert('Fill phone, amount and settings first!');return;}
 btn.disabled=true;
 status.innerHTML="⏳ Sending STK to "+phone+"...";
 try{
  const res=await fetch('/api/send-stk',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({phone,amount,accountRef:ref,businessShortCode:till,consumerKey:key,consumerSecret:secret,passkey})
  });
  const data=await res.json();
  if(data.ResponseCode=='0'){
    status.innerHTML=`<div class=success>✅ STK Sent!<br>${data.CustomerMessage}<br><small>Checkout: ${data.CheckoutRequestID}</small></div>`;
    document.getElementById('history').innerHTML+=`<div style="font-size:13px;margin-top:5px">✅ ${phone} - Ksh ${amount} - ${new Date().toLocaleTimeString()}</div>`;
  } else {
    status.innerHTML=`<div class=fail>❌ Failed<br><small>${JSON.stringify(data)}</small></div>`;
  }
 }catch(e){status.innerHTML=`<div class=fail>❌ Error: ${e.message}</div>`;}
 btn.disabled=false;
}
</script>
</body>
</html>
